<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>The Banking System</title>
</head>
<body>
    <nav class="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">
        <span class="logo-icon">&#128176;</span>
        <span class="logo-text">Bank<span class="logo-accent">System</span></span>
      </a>
      <button class="nav-cta" id="logout">Logout</button>
    </div>
  </nav>

  <section class="center" id="userScreen">
    <h1>What would you like to do?</h1> <br>
    <button type="button" id="balButton">Check Balance</button> <br>
    <button type="button" id="withButton">Withdraw</button> <br>
    <button type="button" id="depButton">Deposit</button>
    </section>

  <section class="hidden" id="result">
      <h1 id="textResult"></h1><br>
      <button class="back">Back</button>
  </section>

  <section class="hidden" id="withScreen">
      <input type="text" id="withAmount" placeholder="Enter amount"> <br>
      <button type="button" id="withEnter">Enter</button> <br>
      <button class="back">Back</button>
  </section>

  <section class="hidden" id="depScreen">
      <input type="text" id="depAmount" placeholder="Enter amount"> <br>
      <button type="button" id="depEnter">Enter</button> <br>
      <button class="back">Back</button>
  </section>

    <script src="user.js"></script>
</body>
</html>
