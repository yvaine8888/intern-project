<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Banking System</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="center" id="roleScreen">
    <h1>Welcome to this Online Banking System!</h1><br>
    <p>Are you an admin or user?</p><br>
    <button type="button" id="adminButton">Adminstrator</button><br>
    <button type="button" id="userButton">Account Holder</button>
  </section>

  <section class="hidden" id="loginScreen">
    <h1>Login</h1> <br>
    <input type="text" id="accountNum" placeholder="Enter your account number"> <br>
    <input type="text" id="pin" placeholder="Enter your PIN"> <br> <br>
    <button type="button" id="loginButton">Login</button>
  </section>
  <script src="app.js" defer></script>
</body>
</html>
